<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description"
    content="Master DevOps, Cloud Engineering, and System Administration with hands-on courses, video tutorials, and real-world tasks." />
  <meta property="og:title" content="DevOps Academy — Learn DevOps, Cloud & SysAdmin" />
  <meta property="og:description"
    content="Structured roadmaps, video courses, and practical tasks to take you from zero to professional." />
  <meta property="og:type" content="website" />
  <title>DevOps Academy — Learn DevOps, Cloud & SysAdmin</title>

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!--
    Primary UI font: Inter — clean, readable, professional
    Display/heading font: Sora — modern, techy feel for headings
    Mono font: JetBrains Mono — code blocks and terminal output
  -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />

  <style>
    /* ── Critical above-the-fold styles to prevent FOUC ── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #root {
      min-height: 100vh;
    }

    /* Prevent layout shift while fonts load */
    .page-loader {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0f172a;
    }
  </style>
</head>

<body>
  <div id="root">
    <!-- Initial loader shown before React hydrates -->
    <div class="page-loader">
      <div style="
        width:44px; height:44px;
        border: 3px solid #334155;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin .8s linear infinite;
      "></div>
      <style>
        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
  </div>
</body>

</html>
