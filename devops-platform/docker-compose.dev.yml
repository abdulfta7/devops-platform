version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: devops-platform-backend-dev
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=dev_jwt_secret_for_development_only
      - STRIPE_SECRET_KEY=sk_test_your_stripe_key_here
      - CLIENT_URL=http://localhost:3000
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev
    restart: unless-stopped
    networks:
      - devops-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: devops-platform-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm start
    restart: unless-stopped
    networks:
      - devops-network
    depends_on:
      - backend

networks:
  devops-network:
    driver: bridge
